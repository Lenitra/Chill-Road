<!-- Chill Road — logo « Ligne de crête » (2026-11-19). Police : Inter Light (OFL), lettres espacées à 0,3 em.
     Blanc #FFFFFF, or #FFC233, tuile d'icône #1A1F27. Icônes bitmap : Tools/Logo/make_logo_icons.py -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <g transform="translate(120 30)">
    <path d="M2 74 L62 46 L96 58 L158 14 L204 48 L240 34 L296 66" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M296 66 C 340 92, 372 34, 412 48 S 476 78, 518 56" fill="none" stroke="#FFC233" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="518" cy="56" r="4" fill="#FFC233"/>
  </g>
  <text x="380" y="200" text-anchor="middle" font-family="Inter" font-weight="300" font-size="72" letter-spacing="21.6" fill="#FFFFFF">CHILL ROAD</text>
  <!-- icône : repère 96 x 60 -->
  <g id="icone" transform="translate(0 0) scale(0)">
    <path d="M4 52 L22 30 L34 38 L52 10 L66 34" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M66 34 C 74 50, 82 22, 92 30" fill="none" stroke="#FFC233" stroke-width="4.6" stroke-linecap="round"/>
  </g>
</svg>
